<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Medievais</title>

    <style>
       
       @font-face {
            font-family: 'Deutsch';
            src: url('deutsch_gothic/Deutsch.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        h1 {
            /* Correção feita aqui: Nome limpo + vírgula + fontes alternativas */
            font-family: 'Deutsch', 'Times New Roman', Times, serif;
            font-size: 3em;
            font-weight: normal;
            font-style: normal;
        }
    </style>
</head>
<body>
    <h1>Sociologia Anotada</h1>
    <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Vitae fugiat reiciendis reprehenderit atque natus vero dicta. Eligendi, obcaecati! Quas, laudantium doloremque id quod provident error consequatur totam alias ad fugiat!</p>
    
</body>
</html>
