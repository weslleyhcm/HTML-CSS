<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes em CSS</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            /* 
            Medidas Absolutas
            cm, mm, in, px, pt, pc

            Medidas Relativas
            em (altura maiúscula), ex (altura x), rem, vw (% da largura da tela), vh (% da altura da tela)  geralemnte 16px = 1cm
            */
            font-size: 16px; 
            margin: 20px;
        }

        p {
            text-align: justify; /* Alinha o texto nas duas extremidades */
            max-width: 600px;    /* Define um limite visual para a linha quebrar */
        }
    </style>
</head>
<body>
    <h1>Questão de Sociologia</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Voluptas hic totam provident veniam eaque molestias consequuntur fuga, assumenda possimus at. Aliquam aperiam quia voluptatem cum quaerat in cupiditate rerum magni.</p>
</body>
</html>
