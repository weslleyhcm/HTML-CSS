<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de caixas</title>
    <style>
        h1 { /* box-level */
            background-color: lightgray;
            height: 300px;
            width: 300px;

            text-align: center;

            border: 10px solid black;
            
            padding: 10px 20px;
            
           margin: 20px auto 40px auto;

           outline: 5px dashed salmon;
        }

a { /* inline-level*/
    border-width: 10px;
    border-style: solid;
    border-color: aquamarine;
}
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Parágrafos também são exemplos de box-level, mas os <a href="#">links são exemplos de caixas de inline-level</a>. Vamos continuar aprendendo.</p>
    
</body>
</html>
