<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>

    /* SELETORES PERSONALIZADOS
            #   = id
            .   = class
            :   = pseudo-class
            ::  = pseudo-element
            >   = children
    
    */

        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        a {
            color: aquamarine;
            text-decoration: none;
        }

        a:hover {
            color: black;
            text-decoration: underline;
        }

        a:active {
            color: blue;
        }

        a::after {
            content: '[link]';
            text-decoration: none;
            font-weight: normal;
            color: brown;

        }
        
    </style>
</head>
<body>
    <h1>Personalizando Links</h1>
    <ul>
        <li><a href="https://www.youtube.com/@LulaOficial">Repositório GitHub</a></li>
        <li><a href="https://www.youtube.com/@LulaOficial">Canal do Youtube</a></li>
        <li><a href="https://www.youtube.com/@LulaOficial">Site do Sociologia Anotada</a></li>
    </ul>
    
</body>
</html>
